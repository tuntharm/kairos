[package]
name = "kairos-lab"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

# Team 1 is intentionally isolated until the Project Lead integrates the crate
# into the repository workspace.
[workspace]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
