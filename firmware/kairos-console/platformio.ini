[platformio]
default_envs = e32r28t

[env]
build_flags =
  -std=gnu++17
build_unflags =
  -std=gnu++11

[env:native]
platform = native
test_build_src = no
lib_ignore =
  KairosApp
  PomodoroApp
  KairosGateway
  TFT_eSPI
  TFT_Touch
  WiFiManager
  WebSockets
  ArduinoJson
build_flags =
  ${env.build_flags}

[env:e32r28t]
platform = platformio/espressif32@6.8.1
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 460800
build_src_filter =
  +<*>
  -<touch_calibration.cpp>
lib_compat_mode = soft
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/Bodmer/TFT_Touch.git#02142affb1aee0934d9220bb5be046ec126bf39d
  tzapu/WiFiManager@2.0.17
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.4.2
build_flags =
  ${env.build_flags}
  -I include
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=20000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1

[env:e32r28t-calibration]
extends = env:e32r28t
build_src_filter =
  -<*>
  +<touch_calibration.cpp>
